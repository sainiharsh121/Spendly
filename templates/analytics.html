{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<div class="cs-wrap">
    <section class="cs-card" aria-labelledby="cs-title">
        <div class="cs-icon-wrap">
            <div class="cs-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <polyline points="12 7 12 12 15.5 14" />
                </svg>
            </div>
        </div>

        <span class="cs-badge">Coming Soon</span>

        <h1 class="cs-title" id="cs-title">Advanced Analytics</h1>

        <p class="cs-desc">
            We're working on powerful insights and visualizations
            to help you understand your spending patterns better.
        </p>

        <div class="cs-dots" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>

        <p class="cs-footnote">We're crafting something special</p>
    </section>
</div>
{% endblock %}
